<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get in touch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="page">
  <div class="card">
    <section class="panel" aria-label="Contact information">
      <div class="panel__content">
        <h1 class="panel__title">Let's start a conversation.</h1>
        <p class="panel__lead">Send a note and we'll reply within two working days.</p>

        <dl class="panel__meta">
          <div class="panel__meta-item">
            <dt>Email</dt>
            <dd><a href="mailto:hello@yourstudio.com">hello@yourstudio.com</a></dd>
          </div>
          <div class="panel__meta-item">
            <dt>Hours</dt>
            <dd>Mon to Fri, 9am–6pm</dd>
          </div>
        </dl>
      </div>

      <svg class="panel__motif" viewBox="0 0 120 84" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="116" height="80" rx="6" stroke="currentColor" stroke-width="1.5"/>
        <path d="M4 7 60 49 116 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </section>

    <section class="form-panel" aria-label="Contact form">
      <form id="contactForm" class="form" novalidate>
        <div class="form__row">
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" autocomplete="name" aria-describedby="fullNameError">
            <p class="field__error" id="fullNameError" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email" aria-describedby="emailError">
            <p class="field__error" id="emailError" aria-live="polite"></p>
          </div>
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" autocomplete="off" aria-describedby="subjectError">
          <p class="field__error" id="subjectError" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" aria-describedby="messageError"></textarea>
          <p class="field__error" id="messageError" aria-live="polite"></p>
        </div>

        <div class="form__footer">
          <p class="form__status" id="formStatus" role="status" aria-live="polite"></p>
          <button type="submit" class="button">Send message</button>
        </div>
      </form>
    </section>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
