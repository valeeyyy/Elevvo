<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get in touch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="bg__ring bg__ring--a"></span>
  <span class="bg__ring bg__ring--b"></span>
  <span class="bg__blob bg__blob--a"></span>
  <span class="bg__blob bg__blob--b"></span>
  <svg class="bg__icon bg__icon--envelope" viewBox="0 0 120 84" fill="none">
    <rect x="2" y="2" width="116" height="80" rx="8" stroke="currentColor" stroke-width="2"/>
    <path d="M4 7 60 49 116 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <svg class="bg__icon bg__icon--plane" viewBox="0 0 100 100" fill="none">
    <path d="M94 8 6 44l30 12 12 30L94 8ZM36 56 94 8" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
  <svg class="bg__icon bg__icon--bubble" viewBox="0 0 100 90" fill="none">
    <path d="M12 8h76a6 6 0 0 1 6 6v46a6 6 0 0 1-6 6H44L24 84V66H12a6 6 0 0 1-6-6V14a6 6 0 0 1 6-6Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
</div>

<main class="page">
  <div class="card">
    <section class="panel" aria-label="Contact information">
      <div class="panel__content">
        <h1 class="panel__title">Let's start a conversation.</h1>
        <p class="panel__lead">Send a note and we'll reply within two working days.</p>

        <dl class="panel__meta">
          <div class="panel__meta-item">
            <dt>Email</dt>
            <dd><a href="mailto:claire.winslow@gmail.com">claire.winslow@gmail.com</a></dd>
          </div>
          <div class="panel__meta-item">
            <dt>Hours</dt>
            <dd>Mon to Fri, 9am–6pm</dd>
          </div>
        </dl>
      </div>

      <svg class="panel__motif" viewBox="0 0 120 84" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="116" height="80" rx="6" stroke="currentColor" stroke-width="1.5"/>
        <path d="M4 7 60 49 116 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </section>

    <section class="form-panel" aria-label="Contact form">
      <form id="contactForm" class="form" novalidate>
        <div class="form__row">
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" autocomplete="name" aria-describedby="fullNameError">
            <p class="field__error" id="fullNameError" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email" aria-describedby="emailError">
            <p class="field__error" id="emailError" aria-live="polite"></p>
          </div>
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" autocomplete="off" aria-describedby="subjectError">
          <p class="field__error" id="subjectError" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" aria-describedby="messageError"></textarea>
          <p class="field__error" id="messageError" aria-live="polite"></p>
        </div>

        <div class="form__footer">
          <button type="submit" class="button">Send message</button>
        </div>
      </form>
    </section>
  </div>
</main>

<div class="modal" id="successModal" role="dialog" aria-modal="true" aria-labelledby="successTitle" aria-describedby="successText" hidden>
  <div class="modal__box">
    <div class="modal__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.5 10 17.5 19 7.5"/>
      </svg>
    </div>
    <h2 class="modal__title" id="successTitle">Message sent</h2>
    <p class="modal__text" id="successText">Thanks for reaching out. We'll reply within two working days.</p>
    <button type="button" class="button modal__close" id="modalClose">Done</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
