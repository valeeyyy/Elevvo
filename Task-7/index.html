<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#11151c">
<meta name="description" content="Skyline shows real-time weather and a 3-day forecast for your location and any city you search.">
<title>Skyline — Weather</title>
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com">
<link rel="preconnect" href="https://geocoding-api.open-meteo.com">
<link rel="preconnect" href="https://api.bigdatacloud.net">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<svg class="icon-sprite" aria-hidden="true" focusable="false">
<defs>
  <symbol id="icon-search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <line x1="15.3" y1="15.3" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-close" viewBox="0 0 24 24">
    <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-locate" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="2.3" fill="currentColor"/>
    <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <line x1="12" y1="1.5" x2="12" y2="4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="12" y1="19.7" x2="12" y2="22.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="1.5" y1="12" x2="4.3" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="19.7" y1="12" x2="22.5" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-refresh" viewBox="0 0 24 24">
    <path d="M20 11A8 8 0 1 0 18.6 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4.6" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <line x1="12" y1="1.5" x2="12" y2="4.2"/>
      <line x1="12" y1="19.8" x2="12" y2="22.5"/>
      <line x1="1.5" y1="12" x2="4.2" y2="12"/>
      <line x1="19.8" y1="12" x2="22.5" y2="12"/>
      <line x1="4.6" y1="4.6" x2="6.5" y2="6.5"/>
      <line x1="17.5" y1="17.5" x2="19.4" y2="19.4"/>
      <line x1="4.6" y1="19.4" x2="6.5" y2="17.5"/>
      <line x1="17.5" y1="6.5" x2="19.4" y2="4.6"/>
    </g>
  </symbol>
  <symbol id="icon-moon" viewBox="0 0 24 24">
    <path d="M20 14.3A8.5 8.5 0 1 1 9.7 4a7 7 0 0 0 10.3 10.3Z" fill="currentColor"/>
  </symbol>
  <symbol id="icon-cloud" viewBox="0 0 24 24">
    <path d="M7 18.5a4.3 4.3 0 0 1-.6-8.55 5.6 5.6 0 0 1 10.84-1.9A4.4 4.4 0 0 1 17 18.5H7Z" fill="currentColor"/>
  </symbol>
  <symbol id="icon-cloud-sun" viewBox="0 0 24 24">
    <circle cx="7.6" cy="6.8" r="2.9" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <line x1="7.6" y1="0.9" x2="7.6" y2="2.4"/>
      <line x1="1.8" y1="6.8" x2="3.3" y2="6.8"/>
      <line x1="3.5" y1="2.7" x2="4.5" y2="3.7"/>
    </g>
    <path d="M8 19.5a4.3 4.3 0 0 1-.5-8.56A5.6 5.6 0 0 1 18 9.2a4.4 4.4 0 0 1-.9 10.3H8Z" fill="currentColor"/>
  </symbol>
  <symbol id="icon-cloud-moon" viewBox="0 0 24 24">
    <path d="M10.6 8.8A5.3 5.3 0 0 1 8 3.6a5.3 5.3 0 1 0 5.7 8.3 5.3 5.3 0 0 1-3.1-3.1Z" fill="currentColor"/>
    <path d="M8 19.5a4.3 4.3 0 0 1-.5-8.56A5.6 5.6 0 0 1 18 9.2a4.4 4.4 0 0 1-.9 10.3H8Z" fill="currentColor"/>
  </symbol>
  <symbol id="icon-fog" viewBox="0 0 24 24">
    <path d="M7 14a4 4 0 0 1-.5-7.97A5.4 5.4 0 0 1 16.9 4.9 4.2 4.2 0 0 1 16.5 14H7Z" fill="currentColor" opacity="0.85"/>
    <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <line x1="4" y1="17.3" x2="20" y2="17.3"/>
      <line x1="6" y1="20.3" x2="18" y2="20.3"/>
    </g>
  </symbol>
  <symbol id="icon-drizzle" viewBox="0 0 24 24">
    <path d="M7 15a4 4 0 0 1-.5-7.97A5.4 5.4 0 0 1 16.9 5.9 4.2 4.2 0 0 1 16.5 15H7Z" fill="currentColor"/>
    <g fill="currentColor">
      <circle cx="8.5" cy="19.3" r="1.1"/>
      <circle cx="12.5" cy="20.6" r="1.1"/>
      <circle cx="16" cy="19.3" r="1.1"/>
    </g>
  </symbol>
  <symbol id="icon-rain" viewBox="0 0 24 24">
    <path d="M7 14.5a4 4 0 0 1-.5-7.97A5.4 5.4 0 0 1 16.9 5.4 4.2 4.2 0 0 1 16.5 14.5H7Z" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <line x1="8.5" y1="17.2" x2="7.3" y2="21.3"/>
      <line x1="12.5" y1="17.2" x2="11.3" y2="21.3"/>
      <line x1="16.5" y1="17.2" x2="15.3" y2="21.3"/>
    </g>
  </symbol>
  <symbol id="icon-snow" viewBox="0 0 24 24">
    <path d="M7 14a4 4 0 0 1-.5-7.97A5.4 5.4 0 0 1 16.9 4.9 4.2 4.2 0 0 1 16.5 14H7Z" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="8.5" y1="17.5" x2="8.5" y2="21"/>
      <line x1="6.8" y1="19.25" x2="10.2" y2="19.25"/>
      <line x1="16" y1="17.5" x2="16" y2="21"/>
      <line x1="14.3" y1="19.25" x2="17.7" y2="19.25"/>
    </g>
  </symbol>
  <symbol id="icon-thunder" viewBox="0 0 24 24">
    <path d="M7 13.5a4 4 0 0 1-.5-7.97A5.4 5.4 0 0 1 16.9 3.9 4.2 4.2 0 0 1 16.5 13.5H7Z" fill="currentColor"/>
    <path d="M13 13.5 9.5 19h3l-1 4.3 5-6.8h-3.2l1-3Z" fill="currentColor"/>
  </symbol>
</defs>
</svg>

<header class="topbar">
  <div class="topbar__brand">
    <svg class="icon brand-mark" aria-hidden="true" focusable="false"><use href="#icon-cloud-sun"></use></svg>
    <span>Skyline</span>
  </div>

  <form id="searchForm" class="search" role="search" aria-label="Search for a city">
    <label class="visually-hidden" for="cityInput">Search city</label>
    <div class="search__field">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-search"></use></svg>
      <input id="cityInput" name="city" type="search" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Search a city…">
      <button type="submit" id="searchSubmit" class="btn btn--accent">Search</button>
    </div>
    <div id="searchResults" class="search-results" aria-live="polite"></div>
  </form>

  <div class="unit-toggle" role="group" aria-label="Temperature unit">
    <button type="button" id="unitC" class="unit-btn" aria-pressed="true">°C</button>
    <button type="button" id="unitF" class="unit-btn" aria-pressed="false">°F</button>
  </div>
</header>

<main id="main" tabindex="-1">
  <h1 class="visually-hidden">Skyline — weather dashboard</h1>
  <section aria-label="Cities">
    <ul id="cityList" class="city-list"></ul>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
