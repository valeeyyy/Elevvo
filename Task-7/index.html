<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#11151c">
<meta name="description" content="Skyline shows real-time weather and a 3-day forecast for your location and any city you search.">
<title>Skyline — Weather</title>
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com">
<link rel="preconnect" href="https://geocoding-api.open-meteo.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <div class="topbar__brand">
    <i class="icon brand-mark fa-solid fa-cloud-sun" aria-hidden="true"></i>
    <span>Skyline</span>
  </div>

  <form id="searchForm" class="search" role="search" aria-label="Search for a city">
    <label class="visually-hidden" for="cityInput">Search city</label>
    <div class="search__field">
      <i class="icon fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input id="cityInput" name="city" type="search" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Search a city…">
      <button type="submit" id="searchSubmit" class="btn btn--accent">Search</button>
    </div>
    <div id="searchResults" class="search-results" aria-live="polite"></div>
  </form>

  <button type="button" id="useCurrentLocationBtn" class="btn btn--ghost">Use Current Location</button>

  <div class="unit-toggle" role="group" aria-label="Temperature unit">
    <button type="button" id="unitC" class="unit-btn" aria-pressed="true">°C</button>
    <button type="button" id="unitF" class="unit-btn" aria-pressed="false">°F</button>
  </div>
</header>

<main id="main" tabindex="-1">
  <h1 class="visually-hidden">Skyline — weather dashboard</h1>
  <section aria-label="Cities">
    <ul id="cityList" class="city-list"></ul>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
